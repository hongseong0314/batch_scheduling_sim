<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Four-layer AI MES decision architecture</title>
  <desc id="desc">A paper-style diagram showing upward candidate intelligence from L1 and L2 to L3 and L4, then downward execution intent through L1, L2, Rule Engine, and Command.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fbf"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b25f00"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #111827; stroke-width: 1.4; }
      .layer { fill: #f8fafc; stroke: #111827; stroke-width: 1.4; }
      .layer-strong { fill: #eef4ff; stroke: #1f5fbf; stroke-width: 1.6; }
      .rule { fill: #fff7ed; stroke: #b25f00; stroke-width: 1.5; }
      .cmd { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .small { font: 20px Arial, sans-serif; fill: #374151; }
      .tiny { font: 16px Arial, sans-serif; fill: #4b5563; }
      .title { font: 34px Arial, sans-serif; font-weight: 700; fill: #111827; }
      .subtitle { font: 20px Arial, sans-serif; fill: #374151; }
      .label { font: 25px Arial, sans-serif; font-weight: 700; fill: #111827; }
      .body { font: 19px Arial, sans-serif; fill: #1f2937; }
      .mono { font: 19px Menlo, Consolas, monospace; fill: #111827; }
      .blue { stroke: #1f5fbf; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .orange { stroke: #b25f00; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); }
      .gray { stroke: #4b5563; stroke-width: 3; fill: none; marker-end: url(#arrow-gray); }
      .dash { stroke-dasharray: 9 9; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <text x="70" y="64" class="title">Four-Layer AI MES Decision Decomposition</text>
  <text x="70" y="100" class="subtitle">Local feasibility flows upward; selected execution intent flows downward through validation.</text>

  <rect x="60" y="130" width="1280" height="655" rx="8" class="panel"/>

  <rect x="120" y="585" width="380" height="105" rx="8" class="layer-strong"/>
  <text x="145" y="625" class="label">L1 Local Scheduler / Packer</text>
  <text x="145" y="657" class="body">Generates feasible task-equipment or pack candidates</text>

  <rect x="120" y="430" width="380" height="105" rx="8" class="layer"/>
  <text x="145" y="470" class="label">L2 APC / Process Annotation</text>
  <text x="145" y="502" class="body">Adds recipe, quality, replacement, and risk context</text>

  <rect x="120" y="275" width="380" height="105" rx="8" class="layer"/>
  <text x="145" y="315" class="label">L3 Meta Scheduler</text>
  <text x="145" y="347" class="body">Selects stage, group, budget, and candidate focus</text>

  <rect x="120" y="165" width="380" height="75" rx="8" class="layer"/>
  <text x="145" y="208" class="label">L4 Objective Policy</text>
  <text x="145" y="232" class="tiny">Throughput, yield, tardiness, cost, customer priority</text>

  <path d="M 310 585 L 310 535" class="blue"/>
  <path d="M 310 430 L 310 380" class="blue"/>
  <path d="M 310 275 L 310 240" class="blue"/>
  <text x="55" y="374" transform="rotate(-90 55 374)" class="small">upward candidate intelligence</text>

  <rect x="600" y="205" width="330" height="120" rx="8" class="layer-strong"/>
  <text x="625" y="246" class="label">Portfolio Snapshot</text>
  <text x="625" y="278" class="body">All selected and rejected candidates</text>
  <text x="625" y="307" class="body">Local score + L2 annotation + reason</text>

  <rect x="600" y="385" width="330" height="145" rx="8" class="layer"/>
  <text x="625" y="424" class="label">Upper Scoring</text>
  <text x="625" y="457" class="mono">upper_score = local</text>
  <text x="625" y="486" class="mono">+ due/WIP/objective</text>
  <text x="625" y="515" class="mono">- quality/rule risk</text>

  <rect x="600" y="590" width="330" height="105" rx="8" class="layer"/>
  <text x="625" y="630" class="label">Decision Factorization</text>
  <text x="625" y="662" class="mono">pi(a|s) = pi_L3L4(...)</text>
  <text x="625" y="688" class="mono">          * pi_L1(...)</text>

  <path d="M 500 635 C 540 635 545 265 600 265" class="gray dash"/>
  <path d="M 500 482 C 550 482 552 265 600 265" class="gray dash"/>
  <path d="M 500 327 C 548 327 550 445 600 445" class="gray dash"/>
  <path d="M 500 203 C 548 203 550 445 600 445" class="gray dash"/>

  <rect x="1020" y="165" width="250" height="75" rx="8" class="layer"/>
  <text x="1045" y="208" class="label">L4 Objective</text>
  <text x="1045" y="232" class="tiny">Select active weights</text>

  <rect x="1020" y="275" width="250" height="75" rx="8" class="layer"/>
  <text x="1045" y="318" class="label">L3 Intent</text>
  <text x="1045" y="342" class="tiny">Choose stage/group/candidate</text>

  <rect x="1020" y="385" width="250" height="75" rx="8" class="layer-strong"/>
  <text x="1045" y="428" class="label">L1 Finalization</text>
  <text x="1045" y="452" class="tiny">Concrete allocation</text>

  <rect x="1020" y="495" width="250" height="75" rx="8" class="layer"/>
  <text x="1045" y="538" class="label">L2 Final APC</text>
  <text x="1045" y="562" class="tiny">Recipe/process fields</text>

  <rect x="1020" y="605" width="250" height="75" rx="8" class="rule"/>
  <text x="1045" y="648" class="label">Rule Engine</text>
  <text x="1045" y="672" class="tiny">Validate chain and action</text>

  <rect x="1020" y="715" width="250" height="45" rx="8" class="cmd"/>
  <text x="1045" y="745" class="label">Command / Proposal</text>

  <path d="M 1145 240 L 1145 275" class="orange"/>
  <path d="M 1145 350 L 1145 385" class="orange"/>
  <path d="M 1145 460 L 1145 495" class="orange"/>
  <path d="M 1145 570 L 1145 605" class="orange"/>
  <path d="M 1145 680 L 1145 715" class="orange"/>
  <text x="1322" y="489" transform="rotate(90 1322 489)" class="small">downward execution intent</text>

  <path d="M 930 265 C 970 265 970 203 1020 203" class="gray"/>
  <path d="M 930 445 C 970 445 970 312 1020 312" class="gray"/>
  <path d="M 930 642 C 970 642 970 422 1020 422" class="gray dash"/>

  <rect x="80" y="812" width="1240" height="52" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="105" y="845" class="tiny">Fig. 1. L1 and L2 expose local feasible evidence; L4 and L3 select global intent; L1 and L2 then finalize the actionable command under Rule Engine validation.</text>
</svg>
